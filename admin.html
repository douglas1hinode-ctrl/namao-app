<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123f2b">
<title>Na Mão — Gerar acesso</title>
<style>
  :root{--pine:#123f2b;--pine-deep:#0b2c1e;--gold:#d6a53a;--ink:#16211b;--soft:#5b675c;--line:#dde2d7;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,var(--pine),var(--pine-deep));min-height:100vh;color:#eef3ec;
    display:flex;align-items:center;justify-content:center;padding:22px}
  .card{background:#fff;color:var(--ink);border-radius:20px;max-width:400px;width:100%;padding:26px;
    box-shadow:0 30px 70px rgba(0,0,0,.35)}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
  h1 span{color:var(--gold)}
  .sub{color:var(--soft);font-size:14px;margin-bottom:18px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--soft);margin-bottom:6px}
  input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px}
  button{width:100%;margin-top:14px;border:none;border-radius:13px;padding:14px;font-weight:800;font-size:16px;
    background:var(--gold);color:#241a00;cursor:pointer}
  .status{margin-top:14px;font-size:13.5px;color:var(--soft);min-height:18px;text-align:center}
  #out{display:none;margin-top:16px;text-align:center}
  #qr{background:#fff;padding:10px;border:1px solid var(--line);border-radius:14px}
  .linkrow{display:flex;gap:8px;margin-top:12px}
  .linkrow input{font-size:12px}
  .copy{width:auto;margin:0;padding:0 14px;background:var(--pine);color:#eaf2e9;border-radius:12px;font-weight:700;font-size:13px}
  .hint{font-size:12px;color:var(--soft);margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>Na <span>Mão</span> · acesso</h1>
  <div class="sub">Gera um QR de acesso pro seu amigo. Ele escaneia uma vez e fica logado pra sempre.</div>
  <label>Chave de admin</label>
  <input id="key" type="password" placeholder="sua chave secreta" autocomplete="off">
  <button id="btn">Gerar QR de acesso</button>
  <div class="status" id="status"></div>
  <div id="out">
    <canvas id="qr"></canvas>
    <div class="linkrow">
      <input id="link" readonly>
      <button class="copy" id="copy">Copiar</button>
    </div>
    <div class="hint">Mostre o QR pro seu amigo escanear, ou copie o link e mande no WhatsApp dele. Vale ~1 hora e é de uso único — depois de entrar, ele não precisa mais.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const FN = "https://efmsswuzjfmpfzfimrpc.supabase.co/functions/v1/gerar-acesso";
const $ = id => document.getElementById(id);
async function gerar(){
  const key = $("key").value.trim();
  if(!key){ $("status").textContent = "Digite a chave de admin."; return; }
  $("status").textContent = "Gerando...";
  $("out").style.display = "none";
  try{
    const r = await fetch(FN, { method:"POST", headers:{ "x-admin-key": key } });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.link){ $("status").textContent = (j.error || "Chave incorreta ou erro."); return; }
    $("status").textContent = "Pronto! Mostre o QR pro seu amigo escanear.";
    QRCode.toCanvas($("qr"), j.link, { width:250, margin:1 }, ()=>{});
    $("link").value = j.link;
    $("out").style.display = "block";
  }catch(e){ $("status").textContent = "Falha de conexão."; }
}
$("btn").onclick = gerar;
$("key").addEventListener("keydown", e=>{ if(e.key==="Enter") gerar(); });
$("copy").onclick = ()=>{ $("link").select(); document.execCommand("copy"); $("copy").textContent="Copiado"; setTimeout(()=>$("copy").textContent="Copiar",1500); };
</script>
</body>
</html>
